name: Gapira Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Gapira APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate SDK Manager
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          test -n "$SDKMANAGER" || {
            echo "ERROR: Android SDK Manager not found"
            exit 1
          }

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install Android dependencies
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Restore media module
        shell: bash
        run: |
          mkdir -p TMessagesProj_Modules

          if [ ! -f TMessagesProj_Modules/media/core_settings.gradle ]; then
            rm -rf TMessagesProj_Modules/media
            git clone --depth 1 \
              https://github.com/AtlasXV/androidx-media.git \
              TMessagesProj_Modules/media
          fi

          test -f TMessagesProj_Modules/media/core_settings.gradle

      - name: Verify project files
        run: |
          test -f settings.gradle
          test -f gradlew
          test -f TMessagesProj_App/build.gradle
          test -f TMessagesProj_Modules/media/core_settings.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          find TMessagesProj_App/build/outputs/apk \
            -type f -name "*.apk" -print -quit | grep -q '\.apk$'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gapira-Android-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
