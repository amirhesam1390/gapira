
name: Build Telegram Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      # 1. Checkout
      - name: Checkout Telegram Source
        uses: actions/checkout@v4
        with:
          repository: amirhosinhosinix-jpg/Nava-Android
          ref: master
          submodules: recursive
          fetch-depth: 1

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Free disk space
      - name: Free Disk Space
        run: |
          echo "=== BEFORE ==="
          df -h

          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          sudo apt-get clean

          echo "=== AFTER ==="
          df -h

      # 5. Verify source
      - name: Verify Source
        run: |
          set -e

          echo "Repository:"
          git remote -v

          echo "Commit:"
          git rev-parse HEAD

          test -f gradlew
          test -f settings.gradle

          test -f TMessagesProj_Modules/media/core_settings.gradle

          chmod +x gradlew

          echo "SOURCE CHECK PASSED"

      # 6. Fix duplicate Android resources
      - name: Fix Duplicate PNG WEBP Resources
        shell: bash
        run: |
          set -e

          RES="TMessagesProj/src/main/res"

          echo "=== CHECKING DUPLICATE RESOURCES ==="

          find "$RES" -type f -name 'logo_middle.*' -print

          COUNT=0

          while IFS= read -r -d '' png; do
            webp="${png%.png}.webp"

            if [ -f "$webp" ]; then
              echo "Duplicate found:"
              echo "$png"
              echo "$webp"

              rm -f "$webp"
              COUNT=$((COUNT + 1))
            fi
          done < <(find "$RES" -type f -name '*.png' -print0)

          echo "Removed WEBP duplicates: $COUNT"

          echo "=== VERIFY ==="
          find "$RES" -type f -name 'logo_middle.*' -print

          if find "$RES" -type f -name 'logo_middle.webp' | grep -q .; then
            echo "ERROR: Duplicate WEBP still exists"
            exit 1
          fi

          echo "RESOURCE FIX PASSED"

      # 7. Android SDK and NDK
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # 8. Verify NDK
      - name: Verify Android Environment
        run: |
          echo "JAVA:"
          java -version

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo "NDK:"
          ls "$ANDROID_HOME/ndk/27.2.12479018"

          echo "SDK:"
          sdkmanager --list_installed

          df -h

      # 9. Gradle configuration
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          EOF

      # 10. Install ccache
      - name: Install CCache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

          mkdir -p ~/.ccache
          ccache --max-size=2G
          ccache --show-stats

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # 11. CCache
      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # 12. Gradle cache
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 13. Build
      - name: Build Telegram Debug APK
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            --console=plain
        env:
          CC: ccache clang
          CXX: ccache clang++

      # 14. Verify APK
      - name: Verify APK
        if: success()
        run: |
          echo "=== APK FILES ==="

          find . -type f -name '*.apk' -exec ls -lh {} \;

          APK_COUNT=$(find . -type f -name '*.apk' | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          echo "APK COUNT: $APK_COUNT"

      # 15. Upload APK
      - name: Upload Telegram APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14

      # 16. Build diagnostics
      - name: Build Diagnostics
        if: always()
        run: |
          echo "=== DISK ==="
          df -h

          echo "=== CCACHE ==="
          ccache --show-stats || true

          echo "=== APK ==="
          find . -type f -name '*.apk' -exec ls -lh {} \;

          echo "=== GRADLE ==="
          ./gradlew --version || true
