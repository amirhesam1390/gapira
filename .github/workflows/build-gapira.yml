name: Build Gapira Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gapira-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Gapira Source
        uses: actions/checkout@v4
        with:
          repository: amirhesam1390/gapira
          ref: main
          submodules: false
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Free disk space
        run: |
          echo "=== BEFORE CLEANUP ==="
          df -h
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean
          echo "=== AFTER CLEANUP ==="
          df -h

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Patch jlatexmath
        run: bash scripts/patch_jlatexmath.sh

      - name: Ensure AndroidX Media
        run: |
          set -e
          if [ ! -f TMessagesProj_Modules/media/core_settings.gradle ]; then
            mkdir -p TMessagesProj_Modules
            rm -rf TMessagesProj_Modules/media
            git clone --depth 1 \
              --branch telegram-v1.10.1-ffmpeg \
              https://github.com/Arseny271/media.git \
              TMessagesProj_Modules/media
          fi
          test -f TMessagesProj_Modules/media/core_settings.gradle
          test -d TMessagesProj_Modules/media/libraries/exoplayer
          test -d TMessagesProj_Modules/media/libraries/decoder_ffmpeg
          test -d TMessagesProj_Modules/media/libraries/session
          python3 - <<'PYMEDIA'
          from pathlib import Path
          import re
          p = Path("TMessagesProj_Modules/media/libraries/common/build.gradle")
          if not p.is_file():
              print("WARN: common/build.gradle not found"); raise SystemExit(0)
          lines = p.read_text().splitlines(keepends=True)
          constraints = next((i for i,l in enumerate(lines) if l.strip()=="constraints {"), None)
          api = next((i for i,l in enumerate(lines) if re.match(r"^\s*api\s*\(", l)), None)
          if constraints is None or api is None or api <= constraints:
              print("No constraints wrapper to fix"); raise SystemExit(0)
          body = "".join(lines[constraints+1:api])
          if "implementation project(" not in body:
              print("Unexpected constraints body"); raise SystemExit(0)
          closing = api - 1
          while closing > constraints and not lines[closing].strip():
              closing -= 1
          if lines[closing].strip() != "}":
              print("Cannot locate closing brace"); raise SystemExit(0)
          del lines[closing]; del lines[constraints]
          p.write_text("".join(lines))
          print("SUCCESS: media common/build.gradle patched")
          PYMEDIA

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018" >> local.properties

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Discover APK task
        id: task
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            :TMessagesProj_App:tasks --all 2>&1 | tee gradle-tasks.log || true
          if grep -Eq 'assembleAfatDebug([[:space:]]|$)' gradle-tasks.log; then
            TASK=":TMessagesProj_App:assembleAfatDebug"
          elif grep -Eq 'assembleDebug([[:space:]]|$)' gradle-tasks.log; then
            TASK=":TMessagesProj_App:assembleDebug"
          else
            echo "No supported Debug task found."
            grep -i assemble gradle-tasks.log || true
            exit 1
          fi
          echo "name=$TASK" >> "$GITHUB_OUTPUT"
          echo "Selected task: $TASK"

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew "${{ steps.task.outputs.name }}" \
            --no-daemon --stacktrace --console=plain --max-workers=2 \
            2>&1 | tee build.log
        env:
          CC: ccache clang
          CXX: ccache clang++

      - name: Find APK
        if: success()
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gapira-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gapira-Build-Logs
          path: |
            gradle-tasks.log
            build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Final disk usage
        if: always()
        run: |
          echo "=== FINAL DISK ==="
          df -h
