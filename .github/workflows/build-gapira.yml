
name: Build Telegram Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:

      # 1. Checkout source
      - name: Checkout Telegram Source
        uses: actions/checkout@v4
        with:
          repository: amirhosinhosinix-jpg/Nava-Android
          ref: master
          submodules: recursive
          fetch-depth: 1

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Free disk space
      - name: Free Disk Space
        run: |
          echo "=== DISK BEFORE ==="
          df -h

          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          sudo apt-get clean

          echo "=== DISK AFTER ==="
          df -h

      # 5. Verify source
      - name: Verify Source
        run: |
          set -e

          echo "=== REPOSITORY ==="
          git remote -v

          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== CHECK FILES ==="

          test -f gradlew
          test -f settings.gradle
          test -f TMessagesProj_Modules/media/core_settings.gradle

          chmod +x gradlew

          echo "SOURCE CHECK PASSED"

      # 6. Fix duplicate logo resources
      - name: Fix Duplicate Logo Resources
        shell: bash
        run: |
          set -e

          RES="TMessagesProj/src/main/res"

          echo "=== LOGO RESOURCE SCAN ==="

          COUNT=0

          while IFS= read -r -d '' png; do
            webp="${png%.png}.webp"

            if [ -f "$webp" ]; then
              echo "Duplicate resource:"
              echo "$png"
              echo "$webp"

              rm -f "$webp"

              COUNT=$((COUNT + 1))
            fi
          done < <(
            find "$RES" -type f -name 'logo_middle.png' -print0
          )

          echo "Removed duplicates: $COUNT"

          echo "=== REMAINING LOGO FILES ==="

          find "$RES" -type f -name 'logo_middle.*' -print

          echo "RESOURCE CHECK PASSED"

      # 7. Install SDK and NDK
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # 8. Verify environment
      - name: Verify Android Environment
        run: |
          echo "=== JAVA ==="
          java -version

          echo "=== ANDROID ==="
          echo "$ANDROID_HOME"

          echo "=== NDK ==="
          ls "$ANDROID_HOME/ndk/27.2.12479018"

          echo "=== DISK ==="
          df -h

      # 9. Gradle configuration
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          EOF

      # 10. Install CCache
      - name: Install CCache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

          mkdir -p ~/.ccache

          ccache --max-size=2G

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # 11. Cache CCache
      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # 12. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 13. Disk check
      - name: Check Disk Before Build
        run: |
          echo "=== DISK ==="
          df -h

          echo "=== GRADLE CACHE ==="
          du -sh ~/.gradle 2>/dev/null || true

          echo "=== CCACHE ==="
          du -sh ~/.ccache 2>/dev/null || true

      # 14. Build Debug APK
      - name: Build Telegram Debug APK
        shell: bash
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            --console=plain
        env:
          CC: ccache clang
          CXX: ccache clang++

      # 15. Find APK
      - name: Find APK
        if: success()
        run: |
          echo "=== APK FILES ==="

          find . -type f -name '*.apk' -exec ls -lh {} \;

          APK_COUNT=$(find . -type f -name '*.apk' | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "APK COUNT: $APK_COUNT"

      # 16. Upload APK
      - name: Upload Telegram Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14

      # 17. Final report
      - name: Final Build Report
        if: always()
        run: |
          echo "=== FINAL DISK ==="
          df -h

          echo "=== CCACHE STATS ==="
          ccache --show-stats || true

          echo "=== GENERATED APK ==="
          find . -type f -name '*.apk' -exec ls -lh {} \;

      # 18. Upload diagnostic logs
      - name: Upload Gradle Diagnostic Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Build-Logs
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
